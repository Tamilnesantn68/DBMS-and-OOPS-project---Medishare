# ============================================
# MediShare — Application Configuration
# ============================================

server:
  port: 8080
  servlet:
    context-path: /api

# ── MySQL DataSource ──
spring:
  application:
    name: medishare-api
  datasource:
    url: jdbc:mysql://localhost:3306/medishare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ── JWT Config ──
app:
  jwt:
    secret: ${JWT_SECRET:MediShareDSCSA2024SecretKeyForJWTTokenGeneration256BitMinimum!}
    expiration-ms: 86400000  # 24 hours

# ── Cors ──
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

# ── Logging ──
logging:
  level:
    com.medishare: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# ── OpenAPI ──
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
