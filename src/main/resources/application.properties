# Server — Render sets $PORT; locally defaults to 8080
server.port=${PORT:8080}

# MySQL — credentials come from environment variables when deployed in the cloud.
# Defaults below keep local runs working (localhost MySQL, root/root).
#   Local URL creates the DB automatically; cloud URLs (Aiven/TiDB) set createDatabaseIfNotExist=false
#   because managed MySQL often rejects it — create the schema once in their console instead.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medicine_redistribution?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Create tables on every startup (idempotent CREATE TABLE IF NOT EXISTS).
spring.sql.init.mode=always

# Allowed browser origins for API calls (comma-separated), e.g. https://medishare-8115.netlify.app
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:8080}

logging.level.com.medshare=INFO
